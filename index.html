<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGIS_FED - Mapa Georreferenciado</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Leaflet CSS & JS (Google Maps Style OpenSource) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    #map { height: calc(100vh - 80px); width: 100%; z-index: 1; }
    .loader {
      border-top-color: #2563eb;
      animation: spinner 0.6s linear infinite;
    }
    @keyframes spinner {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 h-screen overflow-hidden flex flex-col">

  <!-- DATALIST GLOBAL DE SECTORES RESTRINGIDOS -->
  <datalist id="listaSectores">
    <option value="933-AA.VV. 25 DE ENERO"></option>
    <option value="933-AA.VV. CARMEN GARAY"></option>
    <option value="933-AA.VV. FUNDO NUEVA ESPERANZA"></option>
    <option value="933-AA.VV. LOS LAURELES"></option>
    <option value="933-AA.VV. PUEBLO LIBRE"></option>
    <option value="933-AA.VV.01 DE MAYO"></option>
    <option value="933-AA.VV.01 DE SETIEMBRE"></option>
    <option value="933-AA.VV.07 DE MAYO"></option>
    <option value="933-AA.VV.09 DE AGOSTO"></option>
    <option value="933-AA.VV.15 DE AGOSTO"></option>
    <option value="933-AA.VV.CESAR VALLEJO"></option>
    <option value="933-AA.VV.CIUDAD COLINA"></option>
    <option value="933-AA.VV.COLONIA TINGALESA"></option>
    <option value="933-AA.VV.EDUARDO VILLASANTE"></option>
    <option value="933-AA.VV.JOSE CARLOS MARIATEGUI"></option>
    <option value="933-AA.VV.JOSE OLAYA BALANDRA"></option>
    <option value="933-AA.VV.JUAN PICON QUEDO"></option>
    <option value="933-AA.VV.JULIO MARTINEZ"></option>
    <option value="933-AA.VV.LAS ALMENDRAS"></option>
    <option value="933-AA.VV.LAS AMAZONAS"></option>
    <option value="933-AA.VV.LAS PALMERAS"></option>
    <option value="933-AA.VV.LOS ANGELES"></option>
    <option value="933-AA.VV.LOS JARDINES"></option>
    <option value="933-AA.VV.LOS PINOS"></option>
    <option value="933-AA.VV.MARIA PARADO DE BELLIDO"></option>
    <option value="933-AA.VV.MONTERRICO"></option>
    <option value="933-AA.VV.NUEVA ESPERANZA"></option>
    <option value="933-AA.VV.NUEVA JERUSALEN"></option>
    <option value="933-AA.VV.NUEV AMANECER"></option>
    <option value="933-AA.VV.PADRES DE FAMILIA"></option>
    <option value="933-AA.VV.PANTOJA"></option>
    <option value="933-AA.VV.PEDREGAL"></option>
    <option value="933-AA.VV.POBLADORES DE CASTILLO GRANDE"></option>
    <option value="933-AA.VV.SAN CARLOS"></option>
    <option value="933-AA.VV.SAN ISIDRO"></option>
    <option value="933-AA.VV.SAN MIGUEL"></option>
    <option value="933-AA.VV.SANTA ROSA"></option>
    <option value="933-SOL NACIENTE"></option>
    <option value="933-COMUNIDAD ASERRADERO"></option>
    <option value="933-COMUNIDAD CAPITAN SOTO"></option>
    <option value="933-COMUNIDAD HUANGANAPAMPA"></option>
    <option value="933-COMUNIDAD HUAYNACAPAC"></option>
    <option value="933-COMUNIDAD JACINTILLO"></option>
    <option value="933-COMUNIDAD LA CURVA"></option>
    <option value="933-COMUNIDAD LA FLORIDA"></option>
    <option value="933-COMUNIDAD MANCO CAPAC"></option>
    <option value="933-COMUNIDAD MANTARO"></option>
    <option value="933-COMUNIDAD MERCED DE LOCRO"></option>
    <option value="933-COMUNIDAD MOYANO"></option>
    <option value="933-COMUNIDAD NUEVA ALTURA"></option>
    <option value="933-COMUNIDAD PACHACUTEC"></option>
    <option value="933-COMUNIDAD PAPAYAL"></option>
    <option value="933-COMUNIDAD PICUROYACU"></option>
    <option value="933-COMUNIDAD SANTA ROSA DE CASTILLA"></option>
    <option value="933-COMUNIDAD SHAMIRO"></option>
    <option value="933-COMUNIDAD SINCHI ROCCA"></option>
    <option value="933-COMUNIDAD VENADO PAMPA"></option>
    <option value="933-COMUNIDAD YURIMAGUAS"></option>
    <option value="933-SIN SECTOR"></option>
  </datalist>

  <!-- CABECERA -->
  <header class="bg-blue-800 text-white shadow-md z-10 px-4 py-3 flex justify-between items-center h-[60px]">
    <div class="flex items-center space-x-3">
      <i data-lucide="map-pin" class="w-6 h-6 text-emerald-400"></i>
      <div>
        <h1 class="text-base font-bold leading-tight">SIGIS_FED - Mapa de Georreferenciación</h1>
        <p class="text-[10px] text-blue-200">Monitoreo de Familias y Personas Georreferenciadas</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <span id="badgeConteo" class="bg-blue-900 text-emerald-300 text-xs px-3 py-1 rounded-full font-bold border border-emerald-500/30">
        Cargando datos...
      </span>
      <button onclick="cargarBaseDatos()" title="Recargar Datos" class="p-1.5 bg-blue-700 hover:bg-blue-600 rounded-lg transition text-white">
        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- PANEL PRINCIPAL CONTENEDOR (FILTROS + MAPA) -->
  <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">

    <!-- PANEL LATERAL DE FILTROS -->
    <aside class="w-full md:w-80 bg-white border-r border-slate-200 shadow-lg p-4 overflow-y-auto space-y-4 z-20 max-h-[40vh] md:max-h-none">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 class="text-xs font-bold text-slate-700 uppercase flex items-center gap-1.5">
          <i data-lucide="filter" class="w-4 h-4 text-blue-600"></i> Filtros de Búsqueda
        </h2>
        <button onclick="limpiarFiltros()" class="text-[11px] text-blue-600 hover:underline font-semibold">
          Limpiar Filtros
        </button>
      </div>

      <!-- FILTRO FICHA FAMILIAR -->
      <div>
        <label for="f_ffamiliar" class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Ficha Familiar</label>
        <input type="text" id="f_ffamiliar" placeholder="Ej: 0001234" oninput="aplicarFiltros()"
          class="w-full px-2.5 py-1.5 border border-slate-300 rounded-lg text-xs font-mono font-bold uppercase focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <!-- FILTRO SECTOR -->
      <div>
        <label for="f_sector" class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Sector</label>
        <input type="text" id="f_sector" list="listaSectores" placeholder="Todos los sectores..." onchange="aplicarFiltros()" oninput="aplicarFiltros()"
          class="w-full px-2.5 py-1.5 border border-slate-300 rounded-lg text-xs font-semibold uppercase focus:ring-2 focus:ring-blue-500 outline-none bg-white">
      </div>

      <!-- FILTRO MANZANA (MZ) -->
      <div>
        <label for="f_mz" class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Manzana (Mz)</label>
        <input type="text" id="f_mz" placeholder="Ej: 5" oninput="aplicarFiltros()"
          class="w-full px-2.5 py-1.5 border border-slate-300 rounded-lg text-xs font-mono focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <!-- FILTRO DNI -->
      <div>
        <label for="f_dni" class="block text-[11px] font-bold text-slate-600 uppercase mb-1">DNI</label>
        <input type="text" id="f_dni" placeholder="Ej: 70000000" maxlength="8" oninput="aplicarFiltros()"
          class="w-full px-2.5 py-1.5 border border-slate-300 rounded-lg text-xs font-mono focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <!-- FILTRO APELLIDOS Y NOMBRES -->
      <div>
        <label for="f_nombre" class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Apellidos y Nombres</label>
        <input type="text" id="f_nombre" placeholder="Buscar por nombre..." oninput="aplicarFiltros()"
          class="w-full px-2.5 py-1.5 border border-slate-300 rounded-lg text-xs uppercase focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <!-- FILTRO RANGO DE FECHA DE NACIMIENTO -->
      <div class="bg-blue-50/70 p-3 rounded-lg border border-blue-100 space-y-2">
        <label class="block text-[11px] font-bold text-blue-900 uppercase">Rango Fecha Nacimiento</label>
        <div>
          <span class="text-[10px] text-slate-500 font-semibold block mb-0.5">Desde:</span>
          <input type="date" id="f_fn_desde" onchange="aplicarFiltros()"
            class="w-full px-2 py-1 border border-slate-300 rounded text-xs outline-none bg-white">
        </div>
        <div>
          <span class="text-[10px] text-slate-500 font-semibold block mb-0.5">Hasta:</span>
          <input type="date" id="f_fn_hasta" onchange="aplicarFiltros()"
            class="w-full px-2 py-1 border border-slate-300 rounded text-xs outline-none bg-white">
        </div>
      </div>
    </aside>

    <!-- MAPA LEAFLET -->
    <main class="flex-1 relative">
      <div id="map"></div>
    </main>
  </div>

  <script>
    lucide.createIcons();

    const URL_CENSO = "https://script.google.com/macros/s/AKfycbz-PaNW15W43wBS8AmlEHfFe4QrUnITK-8yEnvwoGUnpw7PdbpNvJhPCc4q5qDs8c3WWg/exec";
    let baseDatos = [];
    let map = null;
    let markersLayer = L.layerGroup();

    // Inicializar Mapa
    function initMap() {
      // Coordenadas iniciales por defecto (Castillo Grande / Tingo María)
      map = L.map('map').setView([-9.288639, -76.008830], 14);

      // Capa Satelital ESRI
      const satelital = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri'
      });

      // Capa Callejera OpenStreetMap
      const callejero = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      });

      callejero.addTo(map);

      // Control para alternar capas de mapa
      const baseMaps = {
        "Callejero": callejero,
        "Satelital": satelital
      };
      L.control.layers(baseMaps).addTo(map);

      markersLayer.addTo(map);

      cargarBaseDatos();
    }

    // Cargar todos los registros georreferenciados desde el script
    async function cargarBaseDatos() {
      document.getElementById('badgeConteo').textContent = "Cargando...";
      try {
        const response = await fetch(`${URL_CENSO}?action=obtenerTodosMapas`);
        const result = await response.json();

        if (result && result.status === "ok") {
          baseDatos = result.data || [];
          aplicarFiltros();
        } else {
          document.getElementById('badgeConteo').textContent = "0 Registros";
        }
      } catch (error) {
        console.error("Error al cargar mapa:", error);
        document.getElementById('badgeConteo').textContent = "Error de conexión";
      }
    }

    // Convierte formato dd/mm/yyyy a Objeto Date
    function parseFechaPeruana(strFecha) {
      if (!strFecha) return null;
      if (strFecha.includes('-')) {
        const partes = strFecha.split('-');
        if (partes[0].length === 4) return new Date(strFecha);
      }
      const partes = strFecha.split('/');
      if (partes.length === 3) {
        return new Date(partes[2], partes[1] - 1, partes[0]);
      }
      return null;
    }

    // Filtrar y Renderizar los marcadores
    function aplicarFiltros() {
      const ffamiliar = document.getElementById('f_ffamiliar').value.trim().toLowerCase();
      const sector = document.getElementById('f_sector').value.trim().toLowerCase();
      const mz = document.getElementById('f_mz').value.trim().toLowerCase();
      const dni = document.getElementById('f_dni').value.trim().toLowerCase();
      const nombre = document.getElementById('f_nombre').value.trim().toLowerCase();

      const fnDesdeStr = document.getElementById('f_fn_desde').value;
      const fnHastaStr = document.getElementById('f_fn_hasta').value;

      const dateDesde = fnDesdeStr ? new Date(fnDesdeStr) : null;
      const dateHasta = fnHastaStr ? new Date(fnHastaStr) : null;

      markersLayer.clearLayers();

      const filtrados = baseDatos.filter(item => {
        if (ffamiliar && (!item.ffamiliar || !item.ffamiliar.toString().toLowerCase().includes(ffamiliar))) return false;
        if (sector && (!item.sector || !item.sector.toString().toLowerCase().includes(sector))) return false;
        if (mz && (!item.mz || !item.mz.toString().toLowerCase().includes(mz))) return false;
        if (dni && (!item.dni || !item.dni.toString().toLowerCase().includes(dni))) return false;
        if (nombre && (!item.nombreB || !item.nombreB.toString().toLowerCase().includes(nombre))) return false;

        if (dateDesde || dateHasta) {
          const fnFecha = parseFechaPeruana(item.fn);
          if (!fnFecha) return false;
          if (dateDesde && fnFecha < dateDesde) return false;
          if (dateHasta && fnFecha > dateHasta) return false;
        }

        return true;
      });

      document.getElementById('badgeConteo').textContent = `${filtrados.length} Persona(s) Encontrada(s)`;

      // Agrupar integrantes por Coordenadas para mostrar un único Pin por Ficha Familiar
      const gruposCoordenadas = {};

      filtrados.forEach(item => {
        const coords = item.georeferencia.split(',');
        if (coords.length === 2) {
          const lat = parseFloat(coords[0].trim());
          const lng = parseFloat(coords[1].trim());

          if (!isNaN(lat) && !isNaN(lng)) {
            const key = `${lat},${lng}`;
            if (!gruposCoordenadas[key]) {
              gruposCoordenadas[key] = { lat, lng, ffamiliar: item.ffamiliar, integrantes: [] };
            }
            gruposCoordenadas[key].integrantes.push(item);
          }
        }
      });

      const bounds = [];

      // Crear Marcadores
      Object.values(gruposCoordenadas).forEach(grupo => {
        bounds.push([grupo.lat, grupo.lng]);

        let popupContent = `
          <div class="p-1 font-sans text-xs max-w-xs">
            <div class="bg-blue-800 text-white p-2 rounded-t font-bold flex justify-between items-center mb-2">
              <span>Ficha: ${grupo.ffamiliar || 'S/N'}</span>
              <span class="text-[10px] bg-blue-900 px-1.5 py-0.5 rounded text-emerald-300">${grupo.integrantes.length} Integrante(s)</span>
            </div>
            <p class="text-[11px] font-semibold text-slate-700 mb-1"><strong>Sector:</strong> ${grupo.integrantes[0].sector || '-'}</p>
            <p class="text-[11px] font-semibold text-slate-700 mb-2"><strong>Ref. / Mz:</strong> ${grupo.integrantes[0].ref_direccion || '-'} (Mz ${grupo.integrantes[0].mz || '-'})</p>
            
            <div class="border-t pt-2 space-y-2 max-h-48 overflow-y-auto">
        `;

        grupo.integrantes.forEach(ing => {
          popupContent += `
            <div class="bg-slate-50 p-2 rounded border border-slate-200 text-[11px]">
              <p class="font-bold text-blue-900 uppercase">${ing.nombreB}</p>
              <p><strong>DNI:</strong> ${ing.dni} | <strong>F.Nac:</strong> ${ing.fn || '-'}</p>
              <p><strong>HC:</strong> ${ing.hclinica || '-'} | <strong>Tel:</strong> ${ing.telefono || '-'}</p>
            </div>
          `;
        });

        popupContent += `</div></div>`;

        const marker = L.marker([grupo.lat, grupo.lng]).bindPopup(popupContent);
        markersLayer.addLayer(marker);
      });

      // Centrar mapa dinámicamente si hay resultados
      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 17 });
      }
    }

    function limpiarFiltros() {
      document.getElementById('f_ffamiliar').value = "";
      document.getElementById('f_sector').value = "";
      document.getElementById('f_mz').value = "";
      document.getElementById('f_dni').value = "";
      document.getElementById('f_nombre').value = "";
      document.getElementById('f_fn_desde').value = "";
      document.getElementById('f_fn_hasta').value = "";
      aplicarFiltros();
    }

    window.onload = initMap;
  </script>
</body>
</html>
